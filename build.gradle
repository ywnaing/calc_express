plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '6.0.7'
}

group 'dev.yewintnaing'
version '1.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

ext.isReleaseVersion = !version.endsWith("SNAPSHOT")

// -------------------------------------
// here 'publishing' extension will come
// -------------------------------------


tasks.withType(Sign) {
    onlyIf { isReleaseVersion }
}

dependencies {
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.4.14'
}

// Test configuration
test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// JaCoCo configuration
jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

// Checkstyle configuration
checkstyle {
    toolVersion = '10.12.5'
    configFile = file("${rootDir}/checkstyle.xml")
    ignoreFailures = false
}

tasks.withType(Checkstyle) {
    enabled = file("${rootDir}/checkstyle.xml").exists()
}

// PMD configuration
pmd {
    toolVersion = '6.55.0'
    ruleSets = []
    ruleSetFiles = files("${rootDir}/pmd-ruleset.xml")
    ignoreFailures = false
}

tasks.withType(Pmd) {
    enabled = file("${rootDir}/pmd-ruleset.xml").exists()
}

// SpotBugs configuration
spotbugs {
    ignoreFailures = true
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
    enabled = false
    reports {
        html.required = true
        xml.required = false
    }
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'expreval'
            from components.java
            pom {
                name = 'ExprEval'
                description = 'ExprEval is a modern Java 17 library for evaluating dynamic mathematical expressions.'
                url = 'https://github.com/jdev-yewintnaing/calc_express'


                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'yewintnaing'
                        name = 'yewintnaing'
                        email = 'yewintt.naing@gmail.com'
                    }
                }
                scm {
                    url = 'https://github.com/jdev-yewintnaing/calc_express'

                }
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/jdev-yewintnaing/calc_express")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }

    }
}


signing {
    afterEvaluate { project ->
        required { isReleaseVersion && gradle.taskGraph.hasTask("publish") }
        sign publishing.publications.mavenJava
    }
}